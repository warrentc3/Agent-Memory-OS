name: Publish to MCP Registry

# Publishes server.json to the official MCP Registry (registry.modelcontextprotocol.io)
# using GitHub OIDC — no stored credentials. The io.github.yamantaka520/* namespace
# is auto-verified because this workflow runs in that owner's repository.
#
# Runs after a GitHub Release is published, by which point the matching version is
# live on PyPI with the `mcp-name:` marker in its description (the registry verifies
# PyPI package ownership via that marker). Version is taken from the release tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.0.2), without the leading v"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for OIDC
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        run: |
          REF="${{ github.event.inputs.version || github.event.release.tag_name }}"
          echo "version=${REF#v}" >> "$GITHUB_OUTPUT"

      - name: Stamp version into server.json
        run: |
          jq --arg v "${{ steps.v.outputs.version }}" \
            '.version = $v | .packages[0].version = $v' server.json > server.tmp
          mv server.tmp server.json
          cat server.json

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
