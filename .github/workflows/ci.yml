name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api]" httpx numpy
      - name: Install semantic extra (turbovec)
        if: runner.os != 'Windows'
        run: pip install -e ".[semantic]"
      - name: Run test suite
        run: pytest
      - name: Validation harness (quick)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python scripts/validation_run.py --quick
