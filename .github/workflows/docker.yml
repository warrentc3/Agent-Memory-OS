name: Publish Docker image

# Builds a multi-arch image and pushes it to Docker Hub as
# yamantaka520/agent-memory-os:<version> and :latest.
#
# Requires two repository secrets (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME  — your Docker Hub account/namespace (yamantaka520)
#   DOCKERHUB_TOKEN     — a Docker Hub access token (Account Settings → Security)
#
# Runs automatically on every release tag (v*.*.*), and can be triggered
# manually for an existing tag via "Run workflow".
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git tag to build (e.g. v0.12.0)"
        required: true

env:
  IMAGE: yamantaka520/agent-memory-os

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Derive version tag
        id: version
        run: |
          REF="${{ github.event.inputs.ref || github.ref_name }}"
          echo "version=${REF#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
