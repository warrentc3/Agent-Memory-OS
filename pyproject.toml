[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agent-memory-os"
version = "0.12.1"
description = "Local-first, MCP-native memory engine for AI agents with RAM cache and context-budgeted recall."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Bastet Agent Team" }]
keywords = ["ai-agent", "memory", "mcp", "sqlite", "local-first"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.0.0"]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
semantic = ["numpy>=1.26", "turbovec>=0.7,<1.0"]
full = ["mcp>=1.0.0", "fastapi>=0.115", "uvicorn>=0.30", "numpy>=1.26", "turbovec>=0.7,<1.0"]
dev = ["pytest>=8.0"]

[project.scripts]
agent-memory = "agent_memory_os.cli:main"
agent-memory-web = "agent_memory_os.web_app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
