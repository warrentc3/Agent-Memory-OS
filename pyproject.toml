[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agent-memory-os"
version = "1.5.1"
description = "Local-first, MCP-native memory engine for AI agents with RAM cache and context-budgeted recall."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Bastet Agent Team" }]
keywords = ["ai-agent", "memory", "mcp", "sqlite", "local-first"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.0.0"]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
semantic = ["numpy>=1.26", "turbovec>=0.7,<1.0"]
secure-sync = ["cryptography>=42"]
full = ["mcp>=1.0.0", "fastapi>=0.115", "uvicorn>=0.30", "numpy>=1.26", "turbovec>=0.7,<1.0", "cryptography>=42"]
dev = ["pytest>=8.0", "cryptography>=42"]

[project.scripts]
agent-memory = "agent_memory_os.cli:main"
agent-memory-web = "agent_memory_os.web_app:main"
agent-memory-mcp = "agent_memory_os.mcp_server:main"

# Discovered by NousResearch hermes-agent (>=0.18) as a memory-provider
# plugin: `pip install agent-memory-os` inside the Hermes env, enable in
# `hermes plugins`, then set `memory.provider: agent-memory-os`.
[project.entry-points."hermes_agent.plugins"]
agent-memory-os = "agent_memory_os.hermes_plugin"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
